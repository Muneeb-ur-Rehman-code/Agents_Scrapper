<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeadOps · Sign in</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-body">
<div class="login-frame">
    <div class="login-card">
        <aside class="login-visual">
            <div class="login-visual-wash"></div>
            <div class="login-visual-wave login-visual-wave-a"></div>
            <div class="login-visual-wave login-visual-wave-b"></div>
            <div class="login-visual-wave login-visual-wave-c"></div>

            <div class="login-visual-top">
                <span class="login-quote-label">A WISE QUOTE</span>
            </div>

            <div class="login-visual-bottom">
                <h1 class="login-visual-title">Get Everything You Want</h1>
                <p class="login-visual-copy">
                    You can get everything you want if you work hard, trust the process, and stick to the plan.
                </p>
            </div>
        </aside>

        <main class="login-form-side">
            <div class="login-form-inner">
                <div class="login-logo-row">
                    <div class="login-logo-mark" aria-label="LeadOps">
                        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="LeadOps logo">
                    </div>
                </div>

                <h2 class="login-heading">Welcome Back</h2>
                <p class="login-desc">Enter your username and password to access your account</p>

                <form id="loginForm" class="login-form" autocomplete="on">
                    <label class="login-field">
                        <span>Username</span>
                        <input name="username" type="text" autocomplete="username" placeholder="Enter your username" required autofocus>
                    </label>

                    <label class="login-field">
                        <span>Password</span>
                        <div class="login-pass-wrap">
                            <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                            <button class="login-eye" type="button" id="togglePassword" aria-label="Show password">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 11a4 4 0 1 1 4-4 4 4 0 0 1-4 4z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    </label>

                    <div class="login-row">
                        <label class="login-remember">
                            <input type="checkbox" name="remember" value="1">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <div id="loginError" class="login-error" role="alert" hidden></div>

                    <button class="login-submit" id="loginBtn" type="submit">
                        <span class="login-submit-label">Sign In</span>
                        <span class="login-submit-spinner" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </main>
    </div>
</div>

<script>
(() => {
    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");
    const errBox = document.getElementById("loginError");
    const passwordInput = document.getElementById("passwordInput");
    const togglePassword = document.getElementById("togglePassword");

    function showError(msg) {
        errBox.textContent = msg || "Login failed.";
        errBox.hidden = false;
    }

    togglePassword?.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePassword.setAttribute("aria-label", show ? "Hide password" : "Show password");
        togglePassword.classList.toggle("is-on", show);
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.classList.add("is-loading");
        errBox.hidden = true;

        const payload = Object.fromEntries(new FormData(form).entries());
        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || "Invalid credentials.");
            window.location.href = "/";
        } catch (err) {
            showError(err.message);
            btn.disabled = false;
            btn.classList.remove("is-loading");
        }
    });
})();
</script>
</body>
</html>
